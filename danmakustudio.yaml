style:
  danmaku_x: 0
  layer_width_extra: 100
  row_vertical_gap: 1
  multiline_row_gap: 1
  font_family: Microsoft YaHei
  font_size: 32
  text:
    color: '#FFFFFF'
    opacity: 0.6
    outline_color: '#000000'
    outline_width: 1.0
    shadow_color: '#282828'
    shadow_opacity: 0.6
  member_text:
    color: '#50ff8d'
    opacity: 0.6
    outline_color: '#246542'
    outline_width: 1.0
    shadow_color: '#000000'
    shadow_opacity: 0.6
  emoji:
    opacity: 1.0
    size_ratio: 1.0
    spacing: 4
ratio:
  max_text_rows: 20
  text_width_ratio: 0.8
  top_margin: 12
  bottom_margin: 600
animation:
  first_danmaku_at: 2.0
encode:
  gpu_preset: p5
  gpu_cq: 15
  qsv_preset: slow
  qsv_quality: 18
  cpu_preset: medium
  cpu_crf: 18
  cpu_min_reserve_threads: 2
  extra_args: []
system:
  pipe_buffer_size: 10000000
  pipe_queue_size: 16
  ffmpeg_timeout: 10
  stderr_thread_timeout: 5
  video_alignment: 2
  max_queue_frames: 64
recorder:
  proxy: http://127.0.0.1:7897
  download_proxy: http://127.0.0.1:7897
  pot_token_script: D:/youtube-video-download/bgutil-pot.exe
  fmt: bestvideo+bestaudio/best
  output_template: '%(upload_date)s_%(title)s.%(ext)s'
  live_from_start: true
  record_chat: true
  monitor_interval: 60.0
