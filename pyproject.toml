[project]
name = "livedanmaku"
version = "0.1.0"
description = "LiveDanmaku 直播弹幕工坊：YouTube 直播录制/下载 + 弹幕转换分析 + 弹幕压制烧录一体化图形工具"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "lxml>=6.1.1",
    "pyside6>=6.11.1",
    "pyyaml>=6.0",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
# 下载 / 直播录制页依赖 yt-dlp（纯 Python，pip 直接装进 venv，
# GUI 启动时自动把 venv Scripts 前置到 PATH，无需手工配置）
download = ["yt-dlp>=2024.12.13"]

[project.scripts]
livedanmaku = "livedanmaku.cli:main"
livedanmaku-gui = "livedanmaku.gui:main"

[tool.pyright]
extraPaths = ["src"]
typeCheckingMode = "basic"
exclude = ["**/src.bak", "**/htmlcov", "**/.pytest-tmp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livedanmaku"]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["src"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests that require GPU hardware",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
]
